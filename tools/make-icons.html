<!doctype html>
<html>
<head><meta charset="utf-8"><title>Emberhold icons</title>
<style>body{background:#222;color:#eee;font:14px system-ui;padding:16px} canvas{margin:6px;border-radius:22%;vertical-align:middle}</style>
</head>
<body>
<p>Draws the app icon and saves it to <code>icons/</code> via the local dev server.</p>
<div id="out"></div>
<script type="module">
// Draws the icon at 1024×1024. Key content stays inside the central ~75% so it also
// works as a "maskable" icon (Android crops to a circle/squircle).
function drawIcon(ctx, S) {
  const s = S / 1024;
  ctx.save();
  ctx.scale(s, s);
  // dusk sky
  const g = ctx.createLinearGradient(0, 0, 0, 1024);
  g.addColorStop(0, '#241a3a'); g.addColorStop(0.5, '#8a3540'); g.addColorStop(0.78, '#e0743c'); g.addColorStop(1, '#3a1c12');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1024, 1024);
  // sun glow
  const sg = ctx.createRadialGradient(512, 640, 20, 512, 640, 420);
  sg.addColorStop(0, 'rgba(255,220,150,0.95)'); sg.addColorStop(1, 'rgba(255,140,60,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, 1024, 1024);

  // keep tower
  ctx.fillStyle = '#1a0f0c';
  ctx.fillRect(392, 330, 240, 420);
  for (let i = 0; i < 4; i++) ctx.fillRect(392 + i * 66, 290, 42, 46);
  ctx.beginPath(); ctx.moveTo(380, 300); ctx.lineTo(512, 160); ctx.lineTo(644, 300); ctx.fill();
  // flag
  ctx.fillRect(508, 90, 8, 80);
  ctx.fillStyle = '#c8322a';
  ctx.beginPath(); ctx.moveTo(516, 92); ctx.lineTo(600, 112); ctx.lineTo(516, 136); ctx.fill();
  // glowing windows
  ctx.fillStyle = '#ffc25a';
  for (const [x, y] of [[470, 420], [532, 420], [501, 520]]) { ctx.fillRect(x, y, 22, 40); }

  // stone wall band
  const wy = 690;
  const wg = ctx.createLinearGradient(0, wy, 0, 1024);
  wg.addColorStop(0, '#b7ad9c'); wg.addColorStop(1, '#6d655a');
  ctx.fillStyle = wg; ctx.fillRect(0, wy, 1024, 1024 - wy);
  ctx.strokeStyle = 'rgba(40,30,22,0.55)'; ctx.lineWidth = 6;
  for (let r = 0; r < 4; r++) {
    const yy = wy + 40 + r * 80;
    ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(1024, yy); ctx.stroke();
    for (let x = (r % 2) * 64; x < 1024; x += 128) { ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x, yy + 80); ctx.stroke(); }
  }
  for (let x = 0; x < 1024; x += 128) {
    ctx.fillStyle = '#c4baa8'; ctx.fillRect(x + 14, wy - 64, 84, 66);
    ctx.lineWidth = 8; ctx.strokeStyle = '#3b2f25'; ctx.strokeRect(x + 14, wy - 64, 84, 66);
  }

  // the ember: a big flame over the wall
  const fx = 512, fy = 640;
  const glow = ctx.createRadialGradient(fx, fy, 10, fx, fy, 260);
  glow.addColorStop(0, 'rgba(255,200,90,0.85)'); glow.addColorStop(1, 'rgba(255,120,30,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(fx, fy, 260, 0, Math.PI * 2); ctx.fill();
  const flame = (scale, color) => {
    ctx.beginPath();
    ctx.moveTo(fx, fy - 250 * scale);
    ctx.bezierCurveTo(fx + 40 * scale, fy - 150 * scale, fx + 150 * scale, fy - 110 * scale, fx + 130 * scale, fy + 10 * scale);
    ctx.bezierCurveTo(fx + 120 * scale, fy + 110 * scale, fx - 120 * scale, fy + 110 * scale, fx - 130 * scale, fy + 10 * scale);
    ctx.bezierCurveTo(fx - 140 * scale, fy - 80 * scale, fx - 60 * scale, fy - 120 * scale, fx, fy - 250 * scale);
    ctx.fillStyle = color; ctx.fill();
  };
  flame(1, '#e8501f');
  ctx.lineWidth = 14; ctx.strokeStyle = '#5a1a08'; ctx.stroke();
  flame(0.68, '#ff9a2e');
  flame(0.4, '#fff1b0');
  // sparks
  ctx.fillStyle = '#ffd25a';
  for (const [x, y, r] of [[330, 420, 14], [700, 380, 12], [260, 560, 10], [770, 520, 16], [620, 300, 9]]) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

const sizes = [
  ['icon-1024.png', 1024], ['icon-512.png', 512], ['icon-192.png', 192],
  ['apple-touch-icon.png', 180], ['favicon-32.png', 32],
];
const out = document.getElementById('out');
const results = [];
for (const [name, S] of sizes) {
  const c = document.createElement('canvas');
  c.width = c.height = S;
  drawIcon(c.getContext('2d'), S);
  c.style.width = c.style.height = Math.min(S, 160) + 'px';
  out.appendChild(c);
  const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
  const res = await fetch('/icons/' + name, { method: 'PUT', body: blob });
  results.push(`${name}: ${res.status}`);
}
const p = document.createElement('pre');
p.textContent = results.join('\n');
out.appendChild(p);
window.__iconResults = results;
</script>
</body>
</html>
